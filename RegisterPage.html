<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CougerBlog – Register</title>
    <link rel="stylesheet" href="LoginPage.css" />
  </head>
  <body>
    <main>
      <section aria-label="Registration panel" class="loginSection">
        <header class="loginHeader">
          <div class="cougarIcon">
            <img
              src="Icons/spirit-logo01-removebg-preview 1 (3).png"
              alt="Cougar Logo"
              width="70"
              height="70"
            />
          </div>
          <div class="welcomeHeader">
            <h1>Create your CougerBlog account</h1>
            <p>Join the community. Share posts, follow classes, and connect.</p>
          </div>
        </header>

        <form action="#" method="post" autocomplete="on" novalidate>
          <div>
            <label for="firstName">First name*</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="Enter your first name"
              required
            />
          </div>

          <div>
            <label for="lastName">Last name*</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Enter your last name"
              required
            />
          </div>

          <div>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.edu"
              required
            />
          </div>

          <div>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              placeholder="Create a password"
              required
            />
          </div>

          <div>
            <label for="confirmPassword">Confirm password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              minlength="8"
              placeholder="Re-enter your password"
              required
            />
          </div>

          <div>
            <button type="submit">Create account</button>
          </div>

          <div class="OrRow">
            <div class="line"></div>
            <span>Or</span>
            <div class="line"></div>
          </div>

          <div class="ThirdRow">
            <span>Already have an account?</span>
            <a href="LoginPage.html" class="colorLightBlue">Log in</a>
          </div>
        </form>
      </section>

      <section aria-label="Cover image" class="campusImg">
        <img
          src="Icons/campus-dusk-nature-plum (1).jpg"
          alt="Campus with trees and a building at sunset"
        />
      </section>
    </main>
  </body>
</html>
