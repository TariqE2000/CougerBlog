<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CougarBlog – Home</title>
    <link rel="stylesheet" href="Home_Page.css" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <img
          src="Icons/cougar.png"
          alt="Cougar Logo"
          class="nav-logo"
        />
        <a href="#" class="nav-link1">Home</a>
        <a href="LoginPage.html" class="nav-link2">Login</a>
        <a href="ProfilePage.html" class="nav-link3">Profile</a>
      </div>

      <div class="nav-center">
        <input type="text" placeholder="Search Post..." class="search-input" />
      </div>
    </header>

    <!-- Blog Layout -->
    <main class="content">
      <!-- Title + Post Button Row -->
      <div class="contentHeader">
        <!-- This title will be replaced by JS with the current post title -->
        <h1 class="postTitle">Latest Posts</h1>
        <button class="postBtn" id="openPostModal">Post</button>
      </div>

      <!-- Main Blog Section -->
      <section class="mainPost">
        <!-- JS will set the author name here -->
        <p class="postMeta"></p>

        <!-- JS will inject the selected post content here -->
        <article class="postBody"></article>
      </section>

      <!-- Sidebar Section -->
      <!-- JS will create .sidePost cards in here based on DB posts -->
      <aside class="sidebar"></aside>
    </main>

    <!-- Create Post Modal -->
    <div id="postModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>

      <div
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="postModalTitle"
      >
        <button class="modal-close" aria-label="Close" data-close>×</button>

        <header class="modal-header">
          <h2 id="postModalTitle">Create Post</h2>
        </header>

        <div class="modal-body">
          <label class="modal-label" for="newPostTitle">Title</label>
          <input id="newPostTitle" type="text" placeholder="Your post title" />

          <label class="modal-label" for="newPostAuthor">Author</label>
          <input id="newPostAuthor" type="text" placeholder="Your name" />

          <label class="modal-label" for="newPostBody">Body</label>

          <!-- Rich text editor toolbar -->
          <div class="rte-toolbar" aria-label="Formatting toolbar">
            <button
              type="button"
              class="rte-btn"
              data-block="h1"
              title="Title (H1)"
            >
              Title
            </button>
            <button
              type="button"
              class="rte-btn"
              data-block="h2"
              title="Subtitle (H2)"
            >
              Subtitle
            </button>
            <button
              type="button"
              class="rte-btn"
              data-block="p"
              title="Paragraph"
            >
              Body
            </button>
            <span class="rte-sep"></span>
            <button
              type="button"
              class="rte-btn"
              data-inline="bold"
              title="Bold"
            >
              B
            </button>
            <button
              type="button"
              class="rte-btn"
              data-inline="italic"
              title="Italic"
            >
              <em>I</em>
            </button>
            <button
              type="button"
              class="rte-btn"
              data-inline="underline"
              title="Underline"
            >
              <u>U</u>
            </button>
          </div>

          <div
            id="newPostBody"
            class="rte-editor"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            placeholder="Write your post..."
          ></div>
        </div>

        <footer class="modal-actions">
          <button id="cancelPost" class="btn btn-ghost" type="button">
            Cancel
          </button>
          <button id="savePost" class="btn btn-primary" type="button">
            Publish
          </button>
        </footer>
      </div>
    </div>

    <!-- Home page JS -->
    <script src="Home_Page.js"></script>
  </body>
</html>
