<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CougerBlog – Login</title>
    <link rel="stylesheet" href="LoginPage.css" />
  </head>
  <body>
    <!-- Page Wrapper -->
    <main>
      <!-- Left Panel -->
      <section aria-label="Login panel" class="loginSection">
        <header class="loginHeader">
          <!-- Simple cougar logo (SVG) -->
          <div class="cougarIcon">
           <a href="Home_Page.html">
                <img 
                    src="Icons/cougar.png"
                    alt="Cougar Logo"
                    width="70"
                    height="70"
                    style="cursor: pointer;"
                  />
            </a>
          </div>
          <div class="welcomeHeader">
          <h1>Welcome To CougerBlog !</h1>
          <p>Your voice matters. Share your story with the world.</p>
          </div>
        </header>

        <form action="#" method="post" autocomplete="on" novalidate>
          <div>
            <label for="email" class="emailLabel">Email*</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div>
            <label for="password" class="passwordLabel">Password*</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

            <div class="row">
              <label><input type="checkbox" /> Remember me</label>
              <a href="#" class="colorLightBlue">Forget your password ?</a>
            </div>
          </div>

          <div>
            <button id="loginBtn" type="button">Login</button>
          </div>

          <div class="OrRow">
            <div class="line"></div>
            <span>Or</span>
            <div class="line"></div>
          </div>

          <div class="ThirdRow">
            <span>Don’t have an account?</span>
            <a href="RegisterPage.html" class="colorLightBlue">Register</a>
          </div>
      </section>

      <!-- Right Panel Image -->
      <section aria-label="Cover image" class="campusImg">
        <!-- Replace the src with your campus image -->
        <img
          src="Icons/campusNature.jpg"
          alt="Campus with trees and a building at sunset"
        />
      </section>
    </main>
    <script src="LoginPage.js"></script>
  </body>
</html>
